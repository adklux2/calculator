<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px;
      text-align: right;
      margin-bottom: 20px;
    }

    .display .expression {
      color: #a0aec0;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 8px;
    }

    .display .result {
      color: #ffffff;
      font-size: 36px;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active { transform: scale(0.94); }

    .btn-number {
      background: #1a1a2e;
      color: #ffffff;
    }

    .btn-number:hover { background: #2d2d4e; }

    .btn-operator {
      background: #0f3460;
      color: #e94560;
    }

    .btn-operator:hover { background: #1a4a7a; }

    .btn-equals {
      background: #e94560;
      color: #ffffff;
    }

    .btn-equals:hover { background: #c73652; }

    .btn-clear {
      background: #e94560;
      color: #ffffff;
    }

    .btn-clear:hover { background: #c73652; }

    .span-two { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear span-two" onclick="clearAll()">AC</button>
      <button class="btn-operator" onclick="deleteLast()">⌫</button>
      <button class="btn-operator" onclick="append('/')">÷</button>

      <button class="btn-number" onclick="append('7')">7</button>
      <button class="btn-number" onclick="append('8')">8</button>
      <button class="btn-number" onclick="append('9')">9</button>
      <button class="btn-operator" onclick="append('*')">×</button>

      <button class="btn-number" onclick="append('4')">4</button>
      <button class="btn-number" onclick="append('5')">5</button>
      <button class="btn-number" onclick="append('6')">6</button>
      <button class="btn-operator" onclick="append('-')">−</button>

      <button class="btn-number" onclick="append('1')">1</button>
      <button class="btn-number" onclick="append('2')">2</button>
      <button class="btn-number" onclick="append('3')">3</button>
      <button class="btn-operator" onclick="append('+')">+</button>

      <button class="btn-number span-two" onclick="append('0')">0</button>
      <button class="btn-number" onclick="append('.')">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let expression = "";

    function append(value) {
      expression += value;
      document.getElementById("expression").textContent = expression;
      document.getElementById("result").textContent = expression;
    }

    function clearAll() {
      expression = "";
      document.getElementById("expression").textContent = "";
      document.getElementById("result").textContent = "0";
    }

    function deleteLast() {
      expression = expression.slice(0, -1);
      document.getElementById("expression").textContent = expression;
      document.getElementById("result").textContent = expression || "0";
    }

    async function calculate() {
      if (!expression) return;
      const response = await fetch("/calculate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expression })
      });
      const data = await response.json();
      document.getElementById("expression").textContent = expression + " =";
      document.getElementById("result").textContent = data.result;
      expression = String(data.result === "Error" ? "" : data.result);
    }
  </script>
</body>
</html>
